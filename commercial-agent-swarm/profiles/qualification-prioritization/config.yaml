model:
  default: deepseek-v4-flash
  provider: opencode-go
  max_tokens: 4096
memory:
  memory_enabled: false
  user_profile_enabled: false
  write_approval: true
max_concurrent_sessions: 1
agent:
  max_turns: 6
  disabled_toolsets:
    - web
    - browser
    - terminal
    - file
    - code_execution
    - vision
    - image_gen
    - skills
    - todo
    - memory
    - session_search
    - clarify
    - delegation
    - cronjob
    - computer_use
    - messaging
    - video
    - video_gen
    - bfl
    - x_search
    - tts
    - stt
    - context_engine
    - homeassistant
    - spotify
    - yuanbao
toolsets:
  - no_mcp
platform_toolsets:
  cli:
    - no_mcp
mcp_servers: {}
