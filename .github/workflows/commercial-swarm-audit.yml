name: Commercial Swarm Audit

on:
  pull_request:
    branches: [main, production]
    paths:
      - 'commercial-agent-swarm/**'
      - 'src/server/commercial-swarm-validator.ts'
      - 'src/server/commercial-swarm-validator.test.ts'
      - 'scripts/validate-commercial-swarm.ts'
      - 'package.json'
      - '.github/workflows/commercial-swarm-audit.yml'
  push:
    branches: [main, production]
    paths:
      - 'commercial-agent-swarm/**'
      - 'src/server/commercial-swarm-validator.ts'
      - 'src/server/commercial-swarm-validator.test.ts'
      - 'scripts/validate-commercial-swarm.ts'
      - 'package.json'
      - '.github/workflows/commercial-swarm-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commercial-swarm-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Validate simulation package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm --ignore-workspace install --frozen-lockfile

      - name: Run static commercial swarm audit
        run: pnpm --ignore-workspace run audit:commercial-swarm

      - name: Run commercial swarm validator tests
        run: pnpm --ignore-workspace test -- src/server/commercial-swarm-validator.test.ts
