name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint changed JavaScript and TypeScript without adding debt
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" ]]; then base="$BEFORE_SHA"; fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse "$HEAD_SHA^")"
          fi
          mapfile -d '' lint_files < <(git diff --name-only --diff-filter=ACMR -z "$base" "$HEAD_SHA" -- '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx')
          if (( ${#lint_files[@]} == 0 )); then
            echo "No JavaScript or TypeScript files changed." >> "$GITHUB_STEP_SUMMARY"
          else
            pnpm exec eslint -- "${lint_files[@]}"
          fi
      - name: Run full suite once and block regressions against declared debt
        run: node scripts/ci-test-baseline.mjs
      - name: Build
        run: pnpm build
      - name: Verify build output
        shell: bash
        run: test -d dist
